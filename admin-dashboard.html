<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gill Academy | Dashboard</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-fix.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-config.js"></script></head>
<body data-page="dashboard"><div class="grain"></div><section id="app-view" hidden><aside><a class="brand" href="index.html">◎ <span>GILL<small>SHOOTING ACADEMY</small></span></a><nav><button class="nav-item active" data-view="dashboard">◌ Dashboard</button><button class="nav-item" data-view="settings">⚙ Academy Info</button><button class="nav-item" data-view="content">▣ Website Content</button><button class="nav-item" data-view="gallery">▧ Gallery & Images</button><button class="nav-item" data-view="enquiries">✉ Enquiries</button></nav><button id="signout" class="signout">Sign out</button></aside><main><header><div><p class="eyebrow" id="section-label">OVERVIEW</p><h1 id="page-title">Good to see you.</h1></div><a href="index.html" target="_blank">View website ↗</a></header><div id="toast" role="status"></div>
<section class="view" id="dashboard"><div class="metric-grid"><article><small>NEW ADMISSIONS</small><b id="admission-count">—</b></article><article><small>CONTACT MESSAGES</small><b id="message-count">—</b></article><article><small>GALLERY IMAGES</small><b id="gallery-count">—</b></article></div><article class="panel"><h2>Quick actions</h2><p>Keep your academy website current from one secure place.</p><div class="quick-actions"><button data-go="settings">Edit academy info</button><button data-go="gallery">Upload a new image</button><button data-go="content">Update programs & coaches</button></div></article></section>
<section class="view" id="settings" hidden><article class="panel"><h2>Academy information</h2><form id="settings-form" class="form-grid"><label>Academy name<input name="academy_name" required></label><label>Phone<input name="phone" required></label><label>Email<input type="email" name="email" required></label><label>WhatsApp number<input name="whatsapp"></label><label class="full">Address<textarea name="address"></textarea></label><button type="submit">Save academy info</button></form></article></section>
<section class="view" id="content" hidden><div class="toolbar"><select id="resource-select"><option value="programs">Programs</option><option value="coaches">Coaches</option><option value="facilities">Facilities</option><option value="news">News & events</option><option value="testimonials">Testimonials</option><option value="achievements">Achievements</option></select><button id="new-record">+ Add new</button></div><article class="panel"><div id="editor"></div></article><article class="panel"><h2>Saved items</h2><div id="content-list" class="data-list"></div></article></section>
<section class="view" id="gallery" hidden><article class="panel"><h2>Upload gallery image</h2><form id="upload-form" class="form-grid"><label>Image file<input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/avif" required></label><label>Title<input name="title" required></label><label>Category<select name="category"><option value="academy">Academy</option><option value="10m_range">10M Range</option><option value="25m_range">25M Range</option><option value="50m_range">50M Range</option><option value="training">Training</option><option value="events">Events</option><option value="competitions">Competitions</option></select></label><label>Alt text<input name="alt_text" required></label><button type="submit">Upload image</button></form></article><article class="panel"><h2>Gallery library</h2><div id="gallery-list" class="image-list"></div></article></section>
<section class="view" id="enquiries" hidden><div class="toolbar"><select id="enquiry-select"><option value="admissions">Admission enquiries</option><option value="contact_messages">Contact messages</option></select></div><article class="panel"><div id="enquiry-list" class="data-list"></div></article></section>
</main></section><script src="admin.js"></script></body></html>
